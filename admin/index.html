<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin · Objection Master Pro</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="admin-page">
  <header class="admin-head">
    <div class="brand">Objection Master <span>Pro</span> · Admin</div>
    <div class="row">
      <span id="whoami" class="muted small"></span>
      <a href="/" class="ghost-link">← Back to the app</a>
    </div>
  </header>

  <main class="admin-main">
    <section class="card">
      <h3>Invite someone</h3>
      <p class="muted small">They get a one-time link to set their own password. Links expire after 7 days. Nothing is emailed automatically: copy the link, or use “Email it”.</p>
      <form id="invite-form" class="row" autocomplete="off">
        <input name="email" type="email" class="grow" placeholder="name@company.com" required />
        <input name="name" class="grow" placeholder="Name (optional)" />
        <button type="submit" class="primary">Create invite</button>
      </form>
      <p id="invite-msg" class="auth-msg"></p>
      <div id="link-box" class="link-box" hidden>
        <div class="small"><strong id="link-label"></strong></div>
        <div class="row">
          <input id="link-value" class="grow" readonly />
          <button id="copy-link" type="button" class="primary">Copy</button>
          <a id="mail-link" class="button-link">Email it</a>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="row between">
        <h3>Who has access</h3>
        <span id="user-count" class="muted small"></span>
      </div>
      <div class="table-wrap">
        <table class="table users-table">
          <thead><tr><th>Person</th><th>Status</th><th>Last sign-in</th><th>Added</th><th></th></tr></thead>
          <tbody id="user-rows"></tbody>
        </table>
      </div>
    </section>

    <section class="card">
      <h3>Change my password</h3>
      <form id="password-form" class="row" autocomplete="on">
        <input type="email" name="username" autocomplete="username" hidden />
        <input name="current" type="password" class="grow" placeholder="Current password" autocomplete="current-password" required />
        <input name="password" type="password" class="grow" placeholder="New password (10+ characters)" autocomplete="new-password" minlength="10" required />
        <button type="submit">Update</button>
      </form>
      <p id="password-msg" class="auth-msg"></p>
    </section>
  </main>
  <div id="toast" class="toast" hidden></div>
  <script type="module" src="/admin/admin.js"></script>
</body>
</html>
